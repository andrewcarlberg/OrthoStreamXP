name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search the existing issues first: if someone has asked for the same thing, add a 👍 and your use case there instead.

  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: The situation or the problem behind the idea. This matters more than the solution itself, because there may be a simpler way to get there.
      placeholder: "When I fly airliners, I ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: How you imagine it would work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds you use, or how other tools handle this.

  - type: input
    id: version
    attributes:
      label: OrthoStreamXP version
      description: Shown on the **About** page.
      placeholder: "1.5.1"

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not requested yet.
          required: true
